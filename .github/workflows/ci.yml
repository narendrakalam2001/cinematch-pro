name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu  # CPU wheel: much smaller than the CUDA default
          pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check src/ serving/ services/ scripts/ tests/ --output-format=github
        continue-on-error: true # lint failures warn, they don't block CI yet

      - name: Run pytest with coverage
        env:
          # Tests use fakes/mocks for external APIs — no real secrets needed,
          # but modules that construct clients at import time still need a
          # non-empty value to pass validation.
          TMDB_API_KEY: "ci-placeholder-key"
          OMDB_API_KEY: "ci-placeholder-key"
          GEMINI_API_KEY: "ci-placeholder-key"
        run: |
          pytest tests/ -v --cov=src --cov=serving --cov=services --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: cinematch-pro-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
